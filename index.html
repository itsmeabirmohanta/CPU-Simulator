<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>CPU Simulator — Visual Microprocessor Learning Platform</title>
    <meta name="description" content="CPU Simulator is an interactive, visual 8-bit CPU simulator. Watch every fetch, decode, and execute cycle animate in real time. Built for students and educators." />
    <meta name="author" content="Abir Mahanta" />
    <meta name="keywords" content="CPU simulator, microprocessor, assembly language, computer architecture, 8-bit, fetch decode execute, learning, education" />
    <link rel="canonical" href="/" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/logo/FaviconBlack.ico" />
    <link rel="apple-touch-icon" href="/logo/FaviconBlack.ico" />
    <script>
      (function() {
        const updateFavicon = () => {
          const isDark = localStorage.getItem("cpu-sim-theme") === "dark" || 
                        (localStorage.getItem("cpu-sim-theme") === null && 
                         window.matchMedia("(prefers-color-scheme: dark)").matches);
          const favicon = document.querySelector('link[rel="icon"]');
          const appleTouchIcon = document.querySelector('link[rel="apple-touch-icon"]');
          const href = isDark ? "/logo/FaviconWhite.ico" : "/logo/FaviconBlack.ico";
          if (favicon) favicon.href = href;
          if (appleTouchIcon) appleTouchIcon.href = href;
        };
        updateFavicon();
        window.addEventListener("storage", updateFavicon);
        const observer = new MutationObserver(updateFavicon);
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
      })();
    </script>

    <!-- Theme -->
    <meta name="theme-color" content="#7c3aed" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph -->
    <meta property="og:title" content="CPU Simulator — Learn How a CPU Thinks" />
    <meta property="og:description" content="Interactive 8-bit CPU simulator with beginner-friendly animations and advanced register-level control. Free, no setup required." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta property="og:site_name" content="CPU Simulator" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CPU Simulator — Visual Microprocessor Learning" />
    <meta name="twitter:description" content="Interactive 8-bit CPU simulator. Watch every fetch, decode, and execute cycle in real time." />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "CPU Simulator",
      "description": "Visual microprocessor learning simulator with beginner and advanced modes",
      "url": "/",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Person",
        "name": "Abir Mahanta"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
